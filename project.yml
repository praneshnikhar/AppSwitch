name: AppSwitcher
options:
  bundleIdPrefix: com.appswitcher
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  MacApp:
    type: application
    platform: macOS
    sources:
      - MacApp
      - Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.appswitcher.mac
      INFOPLIST_FILE: MacApp/Info.plist
    info:
      path: MacApp/Info.plist
      properties:
        CFBundleName: App Switcher
        CFBundleDisplayName: App Switcher
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
  iOSApp:
    type: application
    platform: iOS
    sources:
      - iOSApp
      - Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.appswitcher.ios
      INFOPLIST_FILE: iOSApp/Info.plist
      TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOSApp/Info.plist
      properties:
        CFBundleName: App Switcher
        CFBundleDisplayName: App Switcher
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        NSLocalNetworkUsageDescription: App Switcher needs local network access to discover your Mac.
        NSBonjourServices:
          - _appswitcher._tcp
